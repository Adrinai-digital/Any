<section id="coaching">
  <h2>Agenda tu sesión de coaching</h2>

  <form id="formAgenda">
  <label for="fecha">Fecha:</label>
  <input type="date" id="fecha" name="fecha" required>

  <label for="hora">Hora:</label>
  <input type="time" id="hora" name="hora" required>

  <input type="hidden" name="curso_id" value="10"> <!-- id del curso Método Learn -->
  <button type="submit">Agendar cita</button>
</form>

<div id="mensaje"></div>
<div id="misCitas"></div>

</section>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const form = document.getElementById("formAgenda");
  const mensajeDiv = document.getElementById("mensaje");

  if (!form) return;

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const data = Object.fromEntries(new FormData(form));
    const token = localStorage.getItem("token"); // obtener JWT

    if (!token) {
      mensajeDiv.textContent = "Debes iniciar sesión para agendar la cita.";
      mensajeDiv.style.color = "red";
      return;
    }

    try {
      const res = await fetch("/api/citas/agenda", {
        method: "POST",
        headers: { 
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify(data),
      });

      const contentType = res.headers.get("content-type");
      if (!contentType || !contentType.includes("application/json")) {
        throw new Error("El servidor no respondió JSON");
      }

      const result = await res.json();

      if (result.mensaje) {
        mensajeDiv.textContent = result.mensaje;
        mensajeDiv.style.color = "green";
      } else if (result.error) {
        mensajeDiv.textContent = result.error;
        mensajeDiv.style.color = "red";
      }
    } catch (err) {
      console.error("Error al agendar cita:", err);
      mensajeDiv.textContent = "Hubo un error al agendar la cita. Intenta de nuevo.";
      mensajeDiv.style.color = "red";
    }
  });
});

async function cargarCitas() {
  const res = await fetch("/api/citas/mis-citas", {
    headers: { "Authorization": "Bearer " + localStorage.getItem("token") }
  });
  const citas = await res.json();

  const div = document.getElementById("misCitas");
  div.innerHTML = citas.map(c => `
    <div>
      Curso: ${c.curso_id} | Fecha: ${c.fecha || "Pendiente"} | Hora: ${c.hora || "Pendiente"}
    </div>
  `).join("");
}

cargarCitas();

db.query(
  `UPDATE citas SET fecha=?, hora=? WHERE user_id=? AND curso_id=? AND fecha IS NULL LIMIT 1`,
  [fecha, hora, userId, curso_id],
  (err, result) => {
    if (err) return res.status(500).json({ error: "Error al agendar la cita" });

    if (result.affectedRows === 0) return res.status(400).json({ error: "No hay sesiones pagadas pendientes" });

    // ✅ Obtener la cita actualizada para enviar email
    db.query(
      `SELECT * FROM citas WHERE user_id=? AND curso_id=? AND fecha=? AND hora=? LIMIT 1`,
      [userId, curso_id, fecha, hora],
      (err2, rows) => {
        if (!err2 && rows.length) enviarAviso(rows[0]);
      }
    );

    res.json({ mensaje: "Cita agendada correctamente" });
  }
);

</script>
<script src="/js/cursos.js"></script>
