<section id="coaching">
  <h2>Agenda tu sesión de coaching</h2>

  <form id="formAgenda">
  <label for="fecha">Fecha:</label>
  <input type="date" id="fecha" name="fecha" required>

  <label for="hora">Hora:</label>
  <input type="time" id="hora" name="hora" required>

  <input type="hidden" name="curso_id" value="10"> <!-- id del curso Método Learn -->
  <button type="submit">Agendar cita</button>
</form>

<div id="mensaje"></div>


</section>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const form = document.getElementById("formAgenda");
  const mensajeDiv = document.getElementById("mensaje");

  if (!form) return; // si no existe el formulario, no hacer nada

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const data = Object.fromEntries(new FormData(form));

    try {
      const res = await fetch("/api/citas/agenda", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });

      // Si la respuesta no es JSON, mostrar mensaje de error
      const contentType = res.headers.get("content-type");
      if (!contentType || !contentType.includes("application/json")) {
        throw new Error("El servidor no respondió JSON");
      }

      const result = await res.json();

      if (result.mensaje) {
        mensajeDiv.textContent = result.mensaje;
        mensajeDiv.style.color = "green";
      } else if (result.error) {
        mensajeDiv.textContent = result.error;
        mensajeDiv.style.color = "red";
      }
    } catch (err) {
      console.error("Error al agendar cita:", err);
      mensajeDiv.textContent = "Hubo un error al agendar la cita. Intenta de nuevo.";
      mensajeDiv.style.color = "red";
    }
  });
});
</script>
